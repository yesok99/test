# WireGuard 服务端配置 (wg-easy 管理, 仅供参考)
# wg-easy 会将此配置持久化在 ~/.wg-easy/wg0.conf

[Interface]
PrivateKey = UNyR48E3dZP54aCnzSnrtfNjMoL/SkYA1jAUQSiej3k=
Address = 10.8.0.1/24
ListenPort = 51820
PostUp = iptables -t nat -A POSTROUTING -s 10.8.0.0/24 -o enp1s0 -j MASQUERADE; iptables -A FORWARD -i wg0 -j ACCEPT; iptables -A FORWARD -o wg0 -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -s 10.8.0.0/24 -o enp1s0 -j MASQUERADE; iptables -D FORWARD -i wg0 -j ACCEPT; iptables -D FORWARD -o wg0 -j ACCEPT

# 客户端配置示例 (替换为实际的客户端公钥)
[Peer]
PublicKey = <客户端公钥>
PresharedKey = <预共享密钥>
AllowedIPs = 10.8.0.2/32
PersistentKeepalive = 25
